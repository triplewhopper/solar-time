name: Update and verify Earth orientation data
on:
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'solar-core.js'
      - 'app.js'
      - 'location-input.js'
      - 'geoid.js'
      - 'vendor/**'
      - 'scripts/**'
      - 'research/pck/scripts/**'
      - 'tests/**'
      - 'data/de441-solar.bsp'
      - 'data/egm2008-5.pgm.gz'
      - 'data/geoid.json'
      - '.github/workflows/update-eop.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: earth-orientation-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check official data and algorithm changes first
        id: plan
        run: python3 scripts/check-update.py
      - name: Test update decision gates
        run: python3 -m unittest discover -s tests -p 'test_update_*.py'
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.needs_validation == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/update-requirements.txt
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.needs_validation == 'true'
        with:
          node-version: '22'
      - name: Install numerical libraries only for changed inputs
        if: steps.plan.outputs.needs_validation == 'true'
        run: python3 -m pip install -r scripts/update-requirements.txt
      - name: Replay immutable November 18 regression fixtures
        if: steps.plan.outputs.needs_validation == 'true'
        run: |
          node tests/full-domain.cjs
          node tests/legacy-tests.cjs
          node tests/legacy-tests.cjs --reconstructed
          node tests/reconstruction-tests.cjs
          node tests/spk-boundaries.cjs
          git restore data/validation.json tests/domain-errors.json.gz
      - name: Apply the checked snapshot or retain unchanged data
        env:
          ALGORITHM_CHANGED: ${{ steps.plan.outputs.algorithm_changed }}
        run: |
          if [ "$ALGORITHM_CHANGED" = true ]; then
            python3 scripts/update-eop.py --prepared test-cache/update/preflight --force
          else
            python3 scripts/update-eop.py --prepared test-cache/update/preflight
          fi
      - name: Record the successfully validated algorithm
        if: steps.plan.outputs.needs_validation == 'true'
        run: python3 scripts/check-update.py --mark-passed
      - name: Publish validated data and check timestamp
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Earth orientation snapshot and check status'
            git push origin HEAD:main
          fi
      - name: Request ordinary branch Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pages-build.py
      - name: Retain changed-input audit evidence
        if: always() && steps.plan.outputs.needs_validation == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eop-audit-${{ github.run_id }}
          path: |
            test-cache/update/**/*.json
            test-cache/update/**/*.long
          if-no-files-found: ignore
          retention-days: 14
