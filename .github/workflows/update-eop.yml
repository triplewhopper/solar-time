name: Update and verify Earth orientation data
on:
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Revalidate the current official snapshot even when unchanged
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: earth-orientation-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/update-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install numerical libraries
        run: python -m pip install -r scripts/update-requirements.txt
      - name: Test updater failure gates
        run: python -m unittest discover -s tests -p 'test_update_*.py'
      - name: Replay immutable November 18 regression fixtures
        run: |
          node tests/full-domain.cjs
          node tests/legacy-tests.cjs
          node tests/legacy-tests.cjs --reconstructed
          node tests/reconstruction-tests.cjs
          node tests/spk-boundaries.cjs
          git restore data/validation.json tests/domain-errors.json.gz
      - name: Fetch and validate candidate snapshot
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = true ]; then
            python scripts/update-eop.py --force
          else
            python scripts/update-eop.py
          fi
      - name: Publish validated data and check timestamp
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Earth orientation snapshot and check status'
            git push origin HEAD:main
          fi
      - name: Request ordinary branch Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pages-build.py
      - name: Retain audit evidence including failed candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eop-audit-${{ github.run_id }}
          path: |
            test-cache/update/**/*.json
            test-cache/update/**/*.long
          if-no-files-found: ignore
          retention-days: 14
